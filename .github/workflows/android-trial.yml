name: Android agent trial
on:
  push:
    branches: [android-agent-trial, main]
    paths: ['android/**', '*.js', '*.html', '*.css', '*.txt', '.github/workflows/android-trial.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle -p android testDebugUnitTest assembleDebug --no-daemon
      - run: cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" android/app/build/outputs/apk/debug/
      - uses: actions/upload-artifact@v4
        with:
          name: SwingLab-Android-Trial-APK
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/apksigner.jar
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: Android-test-results
          path: android/app/build/reports/tests/testDebugUnitTest/
          retention-days: 14
