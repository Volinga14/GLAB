plugins { id 'com.android.application' }
android {
 namespace 'com.swinglab.mobile'
 compileSdk 35
 defaultConfig { applicationId 'com.swinglab.mobile'; minSdk 28; targetSdk 35; versionCode 1; versionName '0.1-experimental' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 buildTypes { debug { applicationIdSuffix '.trial'; debuggable true } }
}
dependencies { implementation 'androidx.webkit:webkit:1.12.1' }
def webFiles = tasks.register('syncSwingLabAssets', Sync) {
 from('../..') { include '*.html', '*.css', '*.js', '*.txt', '*.webmanifest', 'assets/**', 'lab/**'; exclude 'lab/README.md' }
 into(layout.projectDirectory.dir('src/main/assets'))
}
tasks.named('preBuild').configure { dependsOn(webFiles) }
